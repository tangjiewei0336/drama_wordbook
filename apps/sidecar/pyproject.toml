[project]
name = "drama-wordbook-sidecar"
version = "0.1.0"
description = "Local FastAPI sidecar for Bilibili OCR POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "certifi>=2024.8.30",
  "faster-whisper>=1.1.0",
  "pillow>=10.4.0",
  "paddleocr>=2.8.1",
  "paddlepaddle>=3.0.0",
  "sudachipy>=0.6.8",
  "sudachidict-core>=20241021",
  "pyopenjtalk>=0.4.0",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6.11.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
