[project]
name = "drama-wordbook-sidecar"
version = "0.1.0"
description = "Local FastAPI sidecar for Bilibili OCR POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "certifi>=2024.8.30",
  "faster-whisper>=1.1.0",
  "pillow>=10.4.0",
  # PaddleOCR 3.x (PP-OCRv4/v5) ships a multilingual recognizer that handles
  # mixed CJK lines (Chinese + Japanese kana) far better than 2.x's per-lang
  # models. Packaging caveats are addressed by sidecar.spec collecting paddlex
  # data + Cython resource templates.
  "paddleocr>=3.0.0,<4.0.0",
  # PaddleX 3.5 calls AnalysisConfig.set_optimization_level(); it exists on
  # paddle 3.0–3.2.x but was removed again in 3.3+ (AttributeError). Pin below
  # 3.3 until upstream aligns; see ocr_service._patch_paddle_analysis_config().
  "paddlepaddle>=3.0.0,<3.3.0",
  # PaddleOCR 3.x routes through PaddleX pipelines; without the OCR extra,
  # `PaddleOCR(...)` init fails with "A dependency error occurred during
  # pipeline creation".
  "paddlex[ocr-core]>=3.5.0,<3.6.0",
  "sudachipy>=0.6.8",
  "sudachidict-core>=20241021",
  "pyopenjtalk>=0.4.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6.11.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
