[project]
name = "drama-wordbook-server"
version = "0.1.0"
description = "Public sync server for Drama Wordbook"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# share_uploads/ is created at runtime for uploaded assets; setuptools must not
# treat it as a second top-level Python package alongside app/.
[tool.setuptools]
packages = ["app"]
