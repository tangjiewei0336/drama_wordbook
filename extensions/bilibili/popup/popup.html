<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Wordbook 最近词条</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 410px;
        margin: 0;
        padding: 14px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(247, 248, 251, 0.96)),
          radial-gradient(circle at 12% 0%, rgba(214, 95, 74, 0.14), transparent 30%),
          radial-gradient(circle at 88% 10%, rgba(46, 143, 118, 0.14), transparent 32%),
          #f7f8fb;
        color: #18202b;
      }
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0;
        color: #18202b;
        white-space: nowrap;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        width: 246px;
      }
      button {
        border: 1px solid #dfe5eb;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        color: #344054;
        cursor: pointer;
        padding: 7px 9px;
        font-size: 12px;
        font-weight: 700;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      button:hover {
        transform: translateY(-1px);
        border-color: rgba(46, 143, 118, 0.45);
        background: #f1faf6;
      }
      #list {
        max-height: 330px;
        overflow: auto;
      }
      .word-item {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #e7ebef;
        border-radius: 8px;
        padding: 11px;
        margin-bottom: 8px;
        box-shadow: 0 10px 24px rgba(32, 41, 54, 0.06);
      }
      .word-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .surface {
        font-size: 16px;
        font-weight: 800;
      }
      .reading {
        color: #667085;
        font-size: 12px;
      }
      .meaning {
        margin-top: 6px;
        font-size: 13px;
        color: #344054;
        line-height: 1.45;
      }
      .meta {
        margin-top: 6px;
        font-size: 11px;
        color: #7a8696;
        line-height: 1.45;
      }
      .empty {
        color: #667085;
        font-size: 12px;
        padding: 14px 4px;
      }
      .status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 12px;
        color: #24745f;
        font-weight: 700;
      }
      .meter-wrap {
        margin: 10px 0;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #e7ebef;
        border-radius: 8px;
        padding: 11px;
        box-shadow: 0 10px 24px rgba(32, 41, 54, 0.06);
      }
      .meter-title {
        font-size: 12px;
        color: #475467;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .meter-track {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: #edf1f5;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2e8f76, #e0a33a, #d65f4a);
        transition: width 0.2s ease;
      }
      .meter-meta {
        margin-top: 6px;
        font-size: 11px;
        color: #667085;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title">最近添加词语</div>
      <div class="actions">
        <button id="captureBtn">手动截图识别</button>
        <button id="asrStartBtn">开始语音识别</button>
        <button id="asrStopBtn">停止语音识别</button>
        <button id="dashboardBtn">统计界面</button>
        <button id="syncBtn">同步播放</button>
        <button id="settingsBtn">设置</button>
      </div>
    </div>
    <div class="meter-wrap">
      <div class="meter-title">音轨电平</div>
      <div class="meter-track"><div id="audioMeterFill" class="meter-fill"></div></div>
      <div id="audioMeterMeta" class="meter-meta">等待采样...</div>
    </div>
    <div id="asrList"></div>
    <div id="list"></div>
    <div id="status" class="status"></div>
    <script src="./popup.js"></script>
  </body>
</html>
