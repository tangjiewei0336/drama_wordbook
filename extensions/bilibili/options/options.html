<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Wordbook 设置</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(247, 248, 251, 0.96)),
          radial-gradient(circle at 12% 0%, rgba(214, 95, 74, 0.13), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(46, 143, 118, 0.13), transparent 30%),
          #f7f8fb;
        color: #18202b;
      }
      .card {
        max-width: 780px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #e7ebef;
        border-radius: 10px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(32, 41, 54, 0.08);
        backdrop-filter: blur(18px);
      }
      h1 {
        margin: 0 0 20px 0;
        font-size: 24px;
        letter-spacing: 0;
      }
      .row {
        margin-bottom: 16px;
        padding: 14px;
        border: 1px solid #edf0f3;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #344054;
        font-weight: 700;
      }
      input[type="number"],
      input[type="text"] {
        width: 100%;
        max-width: 280px;
        border: 1px solid #dfe5eb;
        border-radius: 8px;
        padding: 8px 10px;
        outline: none;
        color: #18202b;
        background: #fff;
      }
      input:focus {
        border-color: rgba(46, 143, 118, 0.55);
        box-shadow: 0 0 0 3px rgba(46, 143, 118, 0.11);
      }
      .hint {
        margin-top: 4px;
        color: #667085;
        font-size: 12px;
        line-height: 1.5;
      }
      .actions {
        margin-top: 16px;
      }
      .hotkey-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        margin-top: 6px;
      }
      .inline {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      input[type="text"] {
        width: 80px;
      }
      button {
        border: 1px solid #2e8f76;
        border-radius: 8px;
        background: #2e8f76;
        color: #fff;
        padding: 9px 15px;
        cursor: pointer;
        font-weight: 800;
      }
      .status {
        margin-top: 10px;
        min-height: 18px;
        color: #24745f;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>插件设置</h1>
      <div class="row">
        <label>
          <input id="subtitleBandOnly" type="checkbox" />
          仅保留视频下半区（字幕带）进行 OCR
        </label>
      </div>
      <div class="row">
        <label for="subtitleBandTopRatio">字幕带上边界比例（0-1）</label>
        <input id="subtitleBandTopRatio" type="number" min="0" max="1" step="0.01" />
        <div class="hint">默认 0.65，表示仅识别视频画面的下方 35% 区域。</div>
      </div>
      <div class="row">
        <label for="subtitleBandBottomRatio">字幕带下边界比例（0-1）</label>
        <input id="subtitleBandBottomRatio" type="number" min="0" max="1" step="0.01" />
      </div>
      <div class="row">
        <label>
          <input id="fixedSubtitleLayout" type="checkbox" />
          固定双语布局（上半中文，下半日语）
        </label>
      </div>
      <div class="row">
        <label for="subtitleSplitRatio">上下分割比例（中文占比，0.2-0.8）</label>
        <input id="subtitleSplitRatio" type="number" min="0.2" max="0.8" step="0.01" />
        <div class="hint">默认 0.5：字幕带上半用于中文，下半用于日语。</div>
      </div>
      <div class="row">
        <label>
          <input id="autoPauseOnCapture" type="checkbox" />
          截图时自动暂停视频
        </label>
      </div>
      <div class="row">
        <label for="maxRecentWords">最近词条保存数量（10-200）</label>
        <input id="maxRecentWords" type="number" min="10" max="200" step="1" />
      </div>
      <div class="row">
        <label>页面内截图快捷键（可自定义）</label>
        <div class="hotkey-grid">
          <label class="inline"><input id="hotkeyCtrl" type="checkbox" /> Ctrl</label>
          <label class="inline"><input id="hotkeyMeta" type="checkbox" /> Command(⌘)</label>
          <label class="inline"><input id="hotkeyShift" type="checkbox" /> Shift</label>
          <label class="inline"><input id="hotkeyAlt" type="checkbox" /> Option(⌥)/Alt</label>
          <label class="inline">主键 <input id="hotkeyKey" type="text" maxlength="1" placeholder="S" /></label>
        </div>
        <div class="hint">示例：mac 建议 Command + E（若冲突可改 Command + Shift + S）；Windows 建议 Ctrl + Shift + S。</div>
      </div>
      <div class="actions">
        <button id="saveBtn">保存设置</button>
      </div>
      <div id="status" class="status"></div>
    </div>
    <script type="module" src="./options.js"></script>
  </body>
</html>
