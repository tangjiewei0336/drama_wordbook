name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-extension:
    name: Package browser extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create extension zip
        working-directory: extensions/bilibili
        run: |
          zip -r ../../bilibili-extension.zip . \
            -x "*.DS_Store" \
            -x "dashboard/.DS_Store" \
            -x "popup/.DS_Store" \
            -x "options/.DS_Store"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-extension
          path: bilibili-extension.zip
          if-no-files-found: error

  build-desktop:
    name: Build desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            npm-script: dist:mac
          - name: windows
            os: windows-latest
            npm-script: dist:win

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install sidecar dependencies
        working-directory: apps/sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[packaging]"

      - name: Build sidecar executable
        working-directory: apps/sidecar
        run: pyinstaller sidecar.spec --clean --noconfirm

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop package
        working-directory: apps/desktop
        run: npm run ${{ matrix.npm-script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.pkg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            !apps/desktop/release/builder-*.yml
            !apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - package-extension
      - build-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short_sha="${COMMIT_SHA::7}"
          tag="main-${RUN_NUMBER}-${short_sha}"
          title="Main build ${RUN_NUMBER} (${short_sha})"
          notes="Automated release from main at ${COMMIT_SHA}."

          rm -rf release-assets
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            artifact_name="$(basename "$(dirname "$file")")"
            file_name="$(basename "$file")"
            target="release-assets/${file_name}"
            if [ -e "$target" ]; then
              target="release-assets/${artifact_name}-${file_name}"
            fi
            cp "$file" "$target"
          done < <(find artifacts -type f -print0)

          mapfile -d '' files < <(find release-assets -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          gh release create "$tag" "${files[@]}" \
            --title "$title" \
            --notes "$notes" \
            --target "$COMMIT_SHA"
